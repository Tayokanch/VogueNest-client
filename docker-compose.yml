
services:
  vogueshopping_website:
    build: .
    container_name: vogueshopping
    image: vogueshopping:latest
    volumes:
      - ./nginx/vogueshopping.conf:/etc/nginx/conf.d/vogueshopping.conf
    networks:
      - vogueshopping_network
    restart: always

networks:
  vogueshopping_network:
    external: true
